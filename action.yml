name: 'Dead Domain Pinger'
author: 'PiQuark6046 and contributors'
description: 'Probes the domains referenced by AdGuard-style filter list rules and removes the ones that are dead (requires a checkout with fetch-depth: 0)'

inputs:
  filter-root:
    description: 'Directory (relative to the workspace) to scan for filter list files'
    required: false
    default: '.'
  file-extension:
    description: 'File extension used by filter list files'
    required: false
    default: '.txt'
  max-candidates:
    description: 'Maximum number of probe jobs to run in a single workflow run, including queued HTTP follow-ups'
    required: false
    default: '50'
  globalping-api-token:
    description: 'Required Globalping access token, e.g. secrets.GLOBALPING_API_TOKEN'
    required: true
  state-directory:
    description: 'Directory (relative to the workspace) used to persist state, report and PR body files'
    required: false
    default: 'dead-domain-state'
  state-artifact-name:
    description: 'GitHub Actions artifact name used to carry the SQLite state database between runs'
    required: false
    default: 'dead-domain-pinger-state'
  worker-count:
    description: 'Number of Node.js worker threads used to probe selected domains (defaults to os.cpus().length)'
    required: false
    default: ''
  dry-run:
    description: 'Probe domains but do not write any file changes'
    required: false
    default: 'false'
  create-pr:
    description: 'Create a pull request for changed filter files using GitHub CLI'
    required: false
    default: 'false'
  report-artifact-name:
    description: 'GitHub Actions artifact name used to carry the generated Markdown report'
    required: false
    default: 'dead-domain-pinger-report'
  cleanup-branch-prefix:
    description: 'Prefix for per-run cleanup branches and older pull requests to close'
    required: false
    default: 'dead-domain-pinger/cleanup-'
  cleanup-pr-label:
    description: 'Optional label required when identifying older cleanup pull requests'
    required: false
    default: ''
  pr-base:
    description: 'Base branch for the generated pull request'
    required: false
    default: ''
  pr-title:
    description: 'Title for the generated pull request'
    required: false
    default: 'Remove dead domains'

outputs:
  has_changes:
    description: 'Whether any filter list file was changed (always false in dry-run mode)'
    value: ${{ steps.run.outputs.has_changes }}
  dead_domains:
    description: 'JSON array of domains judged dead in this run'
    value: ${{ steps.run.outputs.dead_domains }}
  changed_files:
    description: 'JSON array of filter list files that were changed'
    value: ${{ steps.run.outputs.changed_files }}
  probed_count:
    description: 'Number of domains actually probed in this run'
    value: ${{ steps.run.outputs.probed_count }}
  rate_limited:
    description: 'Whether probing stopped early because of a Globalping rate limit'
    value: ${{ steps.run.outputs.rate_limited }}
  warning_count:
    description: 'Number of warnings collected while evaluating probe results'
    value: ${{ steps.run.outputs.warning_count }}
  report_path:
    description: 'Workspace-relative path to the generated Markdown report'
    value: ${{ steps.run.outputs.report_path }}
  pr_body_path:
    description: 'Workspace-relative path to the generated pull request body'
    value: ${{ steps.run.outputs.pr_body_path }}

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      run: npm install -g pnpm
      shell: bash

    - name: Install dependencies
      run: pnpm install --no-lockfile
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Prepare SQLite state directory
      run: mkdir -p '${{ runner.temp }}/dead-domain-pinger-state'
      shell: bash

    - name: Download SQLite state artifact
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.state-artifact-name }}
        path: ${{ runner.temp }}/dead-domain-pinger-state

    - name: Run dead domain pinger
      id: run
      env:
        CI_WORKSPACE_PATH: ${{ github.workspace }}
        FILTER_ROOT: ${{ inputs.filter-root }}
        FILE_EXTENSION: ${{ inputs.file-extension }}
        MAX_CANDIDATES: ${{ inputs.max-candidates }}
        GLOBALPING_API_TOKEN: ${{ inputs.globalping-api-token }}
        STATE_DIRECTORY: ${{ inputs.state-directory }}
        SQLITE_STATE_PATH: ${{ runner.temp }}/dead-domain-pinger-state/dead-domain-state.sqlite
        WORKER_COUNT: ${{ inputs.worker-count }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: pnpm run ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Create cleanup pull request
      if: inputs.create-pr == 'true' && inputs.dry-run != 'true' && steps.run.outputs.has_changes == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_BODY_PATH: ${{ steps.run.outputs.pr_body_path }}
        CHANGED_FILES: ${{ steps.run.outputs.changed_files }}
        BRANCH_PREFIX: ${{ inputs.cleanup-branch-prefix }}
        PR_BASE: ${{ inputs.pr-base }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_TITLE: ${{ inputs.pr-title }}
        CLEANUP_PR_LABEL: ${{ inputs.cleanup-pr-label }}
      run: |
        set -euo pipefail

        command -v gh >/dev/null 2>&1 || {
          echo 'gh CLI is required when create-pr is enabled' >&2
          exit 1
        }

        [[ -n "${GH_TOKEN}" ]] || {
          echo 'GitHub token is required when create-pr is enabled' >&2
          exit 1
        }

        git rev-parse --is-inside-work-tree >/dev/null
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        Branch="${BRANCH_PREFIX}${GITHUB_RUN_ID}"
        BodyPath="${GITHUB_WORKSPACE}/${PR_BODY_PATH}"
        BaseBranch="${PR_BASE:-${GITHUB_DEFAULT_BRANCH:-${GITHUB_BASE_REF:-main}}}"
        [[ -f "${BodyPath}" ]] || {
          echo "Pull request body file not found: ${BodyPath}" >&2
          exit 1
        }

        ChangedFilesJson="$(node --input-type=module -e '
          const files = JSON.parse(process.env.CHANGED_FILES)
          if (!Array.isArray(files) || files.some(file => typeof file !== "string" || file.length === 0 || file.startsWith("/") || file.split("/").includes(".."))) process.exit(1)
          process.stdout.write(files.join("\n"))
        ')"
        mapfile -t ChangedFileList <<< "${ChangedFilesJson}"

        [[ -n "${ChangedFilesJson}" ]] || {
          echo 'No changed files were reported; skipping pull request creation'
          exit 0
        }

        git switch --create "${Branch}"
        git add -- "${ChangedFileList[@]}"
        git diff --cached --quiet && {
          echo 'No staged changes remain; skipping pull request creation'
          exit 0
        }

        git commit -m 'Remove dead domains'
        git push --set-upstream origin "${Branch}"

        mapfile -t ExistingPullRequests < <(gh pr list --repo "${GH_REPO}" --state open --json number,headRefName,labels --limit 100 --jq '.[] | select(.headRefName | startswith(env.BRANCH_PREFIX)) | [.number, ([.labels[].name] | join(","))] | @tsv')
        for PullRequest in "${ExistingPullRequests[@]}"; do
          [[ -n "${PullRequest}" ]] || continue
          PullRequestNumber="${PullRequest%%$'\t'*}"
          PullRequestLabels="${PullRequest#*$'\t'}"
          if [[ -n "${CLEANUP_PR_LABEL}" && ",${PullRequestLabels}," != *",${CLEANUP_PR_LABEL},"* ]]; then
            continue
          fi
          gh pr close "${PullRequestNumber}" --repo "${GH_REPO}" --comment 'Superseded by a newer dead-domain cleanup run.'
        done

        gh pr create --repo "${GH_REPO}" --head "${Branch}" --base "${BaseBranch}" --title "${PR_TITLE}" --body-file "${BodyPath}"
      shell: bash

    - name: Upload Markdown report artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ inputs.state-directory }}/dead-domain-report.md
        if-no-files-found: error
        compression-level: 9

    - name: Upload SQLite state artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.state-artifact-name }}
        path: ${{ runner.temp }}/dead-domain-pinger-state/dead-domain-state.sqlite
        if-no-files-found: error
        compression-level: 9
